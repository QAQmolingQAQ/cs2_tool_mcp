# Local CS2 DLL MCP configuration; do not commit machine paths.

[mcp_servers.cs2-hammer]
command = "python"
args = ["C:/path/to/cs2_tool_mcp/mcp_server/cs2_mcp_server.py", "--stdio", "--scope", "hammer"]
cwd = "C:/path/to/cs2_tool_mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

